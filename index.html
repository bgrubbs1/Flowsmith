<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowsmith</title>
  <meta name="description" content="A hands-only tabletop water puzzle for Meta Quest. Pinch pipes into place, twist valves, light the valley." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b06a3b'/%3E%3Cpath d='M32 12c8 12 14 20 14 28a14 14 0 0 1-28 0c0-8 6-16 14-28z' fill='%2379c3e8'/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #2b2118; --paper: #f5ead6; --accent: #b06a3b; }
    html, body { margin: 0; height: 100%; background: #f6e3c7; color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #panel { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: rgba(245,234,214,0.94); border: 3px solid var(--accent); border-radius: 22px; padding: 20px 24px; box-sizing: border-box; text-align: center; box-shadow: 0 10px 40px rgba(60,40,20,0.25); }
    h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: 0.5px; }
    p { margin: 6px 0; line-height: 1.4; }
    #enter { margin-top: 12px; font-size: 20px; font-weight: 700; padding: 14px 28px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    #enter:disabled { opacity: 0.5; cursor: default; }
    #note { font-size: 14px; color: #6b5640; min-height: 1em; }
    body.playing #panel { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel">
    <h1>Flowsmith</h1>
    <p>Pinch pipes into place. Twist valves. Get every mill turning just right without spilling a drop.</p>
    <p style="font-size:15px">Hands only · seated · 10 minutes or less · a new puzzle every day</p>
    <button id="enter" disabled>Checking for a headset…</button>
    <p id="note"></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
